name: CI

on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep a result for every commit pushed to main, only cancel outdated PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin-id:
    name: Plugin ID
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check the plugin ID
        env:
          FORBIDDEN_WORDS: plugiit takevant
        run: |
          if ! id="$(jq -er '.id | strings' plugin.json)"; then
            echo "::error file=plugin.json::plugin.json must contain a string \"id\"."
            exit 1
          fi
          # JSON-encoded for display, so the value cannot inject workflow commands.
          id_json="$(jq -c '.id' plugin.json)"
          status=0

          # Azuriom uses the ID as folder name, URL prefix and route name prefix.
          # Matched on the JSON-encoded value: control characters stay escaped,
          # so a trailing newline (dropped by the command substitution) cannot pass.
          id_pattern='^"[a-z0-9]+(-[a-z0-9]+)*"$'
          if ! [[ "$id_json" =~ $id_pattern ]]; then
            echo "::error file=plugin.json::The plugin ID $id_json must be lowercase letters and digits separated by single dashes, like \"my-plugin\"."
            status=1
          fi

          # Lowercase and drop separators so "Take-Vant" or "plug_iit" are caught too.
          normalized="$(printf '%s' "$id" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')"

          for word in $FORBIDDEN_WORDS; do
            if [[ "$normalized" == *"$word"* ]]; then
              echo "::error file=plugin.json::The plugin ID $id_json must not contain \"$word\"."
              status=1
            fi
          done

          if [ "$status" -eq 0 ]; then
            echo "Plugin ID $id_json is valid."
          fi
          exit "$status"

  plugin-checks:
    name: Azuriom plugin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: Check manifest, version, translations, migrations and committed files
        run: php .github/scripts/check-plugin.php

  php-lint:
    name: PHP ${{ matrix.php }} lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Azuriom requires PHP ^8.2.
        php: ['8.2', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Lint PHP files
        run: |
          # Escape values for workflow commands (annotations).
          escape_data() { local s="${1//%/%25}"; s="${s//$'\r'/%0D}"; printf '%s' "${s//$'\n'/%0A}"; }
          escape_property() { local s; s="$(escape_data "$1")"; s="${s//:/%3A}"; printf '%s' "${s//,/%2C}"; }

          count=0
          status=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! output="$(php -l "$file" 2>&1)"; then
              status=1
              line="$(printf '%s\n' "$output" | grep -oE 'on line [0-9]+' | head -n1 | grep -oE '[0-9]+' || true)"
              message="$(printf '%s\n' "$output" | grep -m1 'error' || printf '%s\n' "$output" | head -n1)"
              echo "::error file=$(escape_property "$file"),line=${line:-1}::$(escape_data "$message")"
            fi
          done < <(git ls-files -z -- '*.php' ':(exclude)*.blade.php')

          if [ "$count" -eq 0 ]; then
            echo "::error::No PHP file found to lint."
            exit 1
          fi
          echo "Linted ${count} PHP files with PHP $(php -r 'echo PHP_VERSION;')."
          exit "$status"
